deploy-production:
  stage: Deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - Dockerfile
        - .env.devel
        - .env.stage
        - .env.prod
        - .gitlab-ci.yml
      when: never   # Pipeline tidak akan berjalan jika file dalam 'changes' diubah.
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always # Pipeline akan berjalan jika file ada perubahan.
  before_script:
    - apt update && apt install -y git
    - apt install -y curl vim
    - apt install -y openssh-client
    - mkdir -p ~/.ssh
    - echo "$FWA_PROD_KEY" | sed 's/\\n/\n/g' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n  StrictHostKeyChecking no\n" > ~/.ssh/config
    - |
      ssh -o StrictHostKeyChecking=no -p 9922 $DEV_SSH_CON \
      "echo 'Production - Reset and clean the repository to avoid stale changes in container'; \
      cd $PATH_DIR; \
      git reset --hard; \
      git clean -fd; \
      echo 'Production - Fetch and reset to match the remote branch'; \
      git fetch --all; \
      git reset --hard origin/main; \
      echo 'Production - Local Repository in container was cleaned.'"
  script:
    - mkdir -p ~/.ssh
    - echo "Production - Compiling and update the Code..."
    - echo "$FWA_PROD_KEY" | sed 's/\\n/\n/g' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n  StrictHostKeyChecking no\n" > ~/.ssh/config
    - |
      ssh -o StrictHostKeyChecking=no -p $SSH_PORT $PROD_SSH_CON \
      "echo "Production - Update code and Deployment starting"; \
        cd $PATH_DIR; \
        git pull origin main; \
        docker compose -f $COMPOSE_FILE down $COMPOSE_SRV; \
        docker compose -f $COMPOSE_FILE up -d --build $COMPOSE_SRV; \
        docker builder prune -a -f; \
        echo 'Production - Docker Deployment Completed.'; \
      "
  artifacts:
    paths:
      - build/