deploy-production:
  stage: Deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - Dockerfile
        - .env.devel
        - .env.stage
        - .env.prod
        - .gitlab-ci.yml
      when: never   # Pipeline tidak akan berjalan jika file dalam 'changes' diubah.
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always # Pipeline akan berjalan jika file ada perubahan.
  before_script:
    - apt update && apt install -y git && apt install -y vim
    - mkdir -p ~/.ssh
    - echo "$FWA_PROD_KEY" | sed 's/\\n/\n/g' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n  StrictHostKeyChecking no\n" > ~/.ssh/config
    - |
      ssh -o StrictHostKeyChecking=no -p 9922 $PROD_SSH_CON \
      "echo 'Production - Reset and clean the repository to avoid stale changes in container'; \
      docker exec $CONT_NAME git reset --hard; \
      docker exec $CONT_NAME git clean -fd; \
      echo 'Production - Fetch and reset to match the remote branch'; \
      docker exec $CONT_NAME git fetch --all; \
      docker exec $CONT_NAME git reset --hard origin/main; \
      echo 'Production - Local Repository in container was cleaned.'"
  script:
    - echo "Production - Deployment starting..."
    - mkdir -p ~/.ssh
    - echo "$FWA_PROD_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n  StrictHostKeyChecking no\n" > ~/.ssh/config
    - |
      ssh -o StrictHostKeyChecking=no -p 9922 $PROD_SSH_CON \
      "docker ps --filter 'name=$CONT_NAME' --format '{{.Names}}' | grep -w $CONT_NAME > /dev/null; \
      if [ \$? -eq 0 ]; then \
        echo 'Production - Container $CONT_NAME is already running.'; \
        docker exec $CONT_NAME apt update; \
        docker exec $CONT_NAME apt install -y curl vim git net-tools iputils-ping openssh-client; \
        docker exec $CONT_NAME git config --global user.email 'rizal@weave.co.id'; \
        docker exec $CONT_NAME git config --global user.name 'rizal'; \
        docker exec $CONT_NAME git config --global credential.helper store; \
        docker exec $CONT_NAME git branch --set-upstream-to=origin/main main; \
        docker exec $CONT_NAME git pull origin main; \
        docker exec $CONT_NAME npm install; \
        docker exec $CONT_NAME npm run build --prod; \
        docker stop $CONT_NAME; \
        docker start $CONT_NAME; \
        echo 'Production - Docker Deployment Completed.'; \
        exit 0; \
      else \
        echo 'Production - Image $REGISTRY_URL:$PROD_VER not found, starting a container...'; \
        docker compose -f $PROD_COMPOSE_FILE down $COMPOSE_SRV; \
        docker compose -f $PROD_COMPOSE_FILE up -d --build $COMPOSE_SRV; \
        docker exec $CONT_NAME ssh-keyscan gitlab.com > ~/.ssh/known_hosts; \
        docker exec $CONT_NAME apt update; \
        docker exec $CONT_NAME apt install -y curl vim git net-tools iputils-ping openssh-client; \
        docker exec $CONT_NAME git config --global user.email 'rizal@weave.co.id'; \
        docker exec $CONT_NAME git config --global user.name 'rizal'; \
        docker exec $CONT_NAME git config --global credential.helper store; \
        docker exec $CONT_NAME git branch --set-upstream-to=origin/main main; \
        docker exec $CONT_NAME git pull origin main; \
        docker exec $CONT_NAME npm install; \
        docker exec $CONT_NAME npm run build --prod; \
        docker stop $CONT_NAME; \
        docker start $CONT_NAME; \
        echo 'Production - Docker Deployment Completed.'; \
      fi"
  artifacts:
    paths:
      - build/
  environment:
    name: production
