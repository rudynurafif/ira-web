# FTTH Project
variables:
  DEV_APPS_PATH: "/root/ftth/website"
  STAGE_APPS_PATH: "/root/ftth/website"
  IMG_NAME: "ftth_website"
  
  CONT_PORT: "9500:9500"
  IMG_VER: "1.0"
  PROD_VER: "prod"
  
  
  
  STAGE_SSH_CON: "root@110.239.66.202"
  PROD_SSH_CON: "root@110.239.68.249"
  DB_HOST: "UNIQUE_NAME_DB_HOST=172.17.0.1"
  ENV_DEV: "dev-ftth-api.codifytechnology.com"
  ENV_STAGE: "stage-ftth-api.codifytechnology.com"
  ENV_PROD: "api.codifytechnology.com"
  ENV_BACK_DEV: "ftth-dev.codifytechnology.com"
  ENV_BACK_STAGE: "stage-ftth-web.codifytechnology.com"
  ENV_BACK_PROD: "starliteindonesia.com"

  DEV_SSH_CON: "root@114.119.190.115"
  CONT_NAME: "fwa_website_app"
  REGISTRY_URL: "registry.gitlab.com/macroad-dev/ije-fwa_20072025/fe_web_ije-fwa_22072025"
  REPO_URL: "git@gitlab.com:macroad-dev/ije-fwa_20072025/fe_web_ije-fwa_22072025.git"
  DEV_VER: "devel"
  ENV_FILE: "/apps/fwa_website.env"
  CONT_PATH: "/app"

  COMPOSE_FILE: "/apps/docker-compose.yml"
  COMPOSE_SVC: "fwa-website"


stages:          # List of stages for jobs, and their order of execution
  - Release
  - Build
  - Test
  - Deploy
  - Push

#Add caching for "node_modules/" directory to speed up builds by reusing dependencies from cache.
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
  - node_modules/

devel-job:       # This job runs in the build stage, which runs first.
  stage: Build
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
      changes:
        - Dockerfile
        - .env.devel
        - .env.stage
        - .env.prod
        - .gitlab-ci.yml
      when: never   # Pipeline tidak akan berjalan jika file dalam 'changes' diubah.
    - if: '$CI_COMMIT_BRANCH == "development"'
      when: always # Pipeline akan berjalan jika file ada perubahan.
  before_script:
    - apt update && apt install -y git
    - apt install -y vim
    - apt install -y openssh-client
    - mkdir -p ~/.ssh
    - echo "$FTTH_DEV_KEY" | sed 's/\\n/\n/g' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n  StrictHostKeyChecking no\n" > ~/.ssh/config
    - |
      ssh -o StrictHostKeyChecking=no -p 9922 $DEV_SSH_CON \
      "echo 'Development - Reset and clean the repository to avoid stale changes in container'; \
      docker exec $CONT_NAME git reset --hard; \
      docker exec $CONT_NAME git clean -fd; \
      echo 'Development - Fetch and reset to match the remote branch'; \
      docker exec $CONT_NAME git fetch --all; \
      docker exec $CONT_NAME git reset --hard origin/development; \
      echo 'Development - Local Repository in container was cleaned.'"
  script:
    - mkdir -p ~/.ssh
    - echo "Development - Compiling and update the Code..."
    - echo "$FTTH_DEV_KEY" | sed 's/\\n/\n/g' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n  StrictHostKeyChecking no\n" > ~/.ssh/config
    - |
      ssh -o StrictHostKeyChecking=no -p 9922 $DEV_SSH_CON \
      "docker ps --filter 'name=$CONT_NAME' --format '{{.Names}}' | grep -w $CONT_NAME > /dev/null; \
      if [ \$? -eq 0 ]; then \
        echo 'Development - Container $CONT_NAME is already running.'; \
        docker exec $CONT_NAME apt update; \
        docker exec $CONT_NAME apt install -y curl vim plocate iputils-ping net-tools openssh-client git; \
        docker exec $CONT_NAME git config --global user.email 'rizal@weave.co.id'; \
        docker exec $CONT_NAME git config --global user.name 'rizal'; \
        docker exec $CONT_NAME git config --global credential.helper store; \
        docker exec $CONT_NAME git branch --set-upstream-to=origin/development development; \
        docker exec $CONT_NAME git pull origin development; \
        docker exec $CONT_NAME npm install; \
        docker exec $CONT_NAME npm i sharp; \
        docker exec $CONT_NAME env NODE_OPTIONS="--max_old_space_size=1024" npm run build --prod; \
        docker stop $CONT_NAME; \
        docker start $CONT_NAME; \
        echo 'Development - Docker Deployment Completed.'; \
      else \
        echo 'Development - Image $REGISTRY_URL:$DEV_VER not found, start building...'; \
        docker stop $CONT_NAME; \
        docker compose -f $COMPOSE_FILE down $COMPOSE_SVC; \
        docker rmi $REGISTRY_URL:$DEV_VER; \
        docker compose -f $COMPOSE_FILE up -d --build $COMPOSE_SVC; \
        docker cp $ENV_FILE $CONT_NAME:$CONT_PATH/.env; \ 
        docker exec $CONT_NAME apt update && apt install -y curl vim plocate iputils-ping net-tools openssh-client git; \
        docker exec $CONT_NAME git config --global user.email 'rizal@weave.co.id'; \
        docker exec $CONT_NAME git config --global user.name 'rizal'; \
        docker exec $CONT_NAME git config --global credential.helper store; \
        docker exec $CONT_NAME git branch --set-upstream-to=origin/development development; \
        docker exec $CONT_NAME git pull origin development; \
        docker exec $CONT_NAME npm install; \
        docker exec $CONT_NAME npm i sharp; \
        docker exec $CONT_NAME env NODE_OPTIONS="--max_old_space_size=1024" npm run build --prod; \
        docker stop $CONT_NAME; \
        docker start $CONT_NAME; \
        echo 'Development - Docker Deployment Completed.'; \
      fi"
  artifacts:
    paths:
      - build/

staging-job:       # This job runs in the build stage, which runs first.
  stage: Build
  rules:
    - if: '$CI_COMMIT_BRANCH == "stage"'
      changes:
        - Dockerfile
        - .env.devel
        - .env.stage
        - .env.prod
        - .gitlab-ci.yml
      when: never   # Pipeline tidak akan berjalan jika file dalam 'changes' diubah.
    - if: '$CI_COMMIT_BRANCH == "stage"'
      when: always # Pipeline akan berjalan jika file ada perubahan.
  before_script:
    - apt update && apt install -y git
    - apt install -y vim
    - apt install -y openssh-client
    - mkdir -p ~/.ssh
    - echo "$FTTH_STAGE_KEY" | sed 's/\\n/\n/g' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n  StrictHostKeyChecking no\n" > ~/.ssh/config
    - |
      ssh -o StrictHostKeyChecking=no -p 9922 $STAGE_SSH_CON \
      "echo 'Staging - Reset and clean the repository to avoid stale changes'; \
      cd $STAGE_APPS_PATH; \
      git reset --hard; \
      git clean -fd; \
      echo 'Staging - Fetch and reset to match the remote branch'; \
      git fetch --all; \
      git reset --hard origin/stage; \
      echo 'Staging - Reset and clean the repository to avoid stale changes in container'; \
      docker exec $CONT_NAME git reset --hard; \
      docker exec $CONT_NAME git clean -fd; \
      echo 'Staging - Fetch and reset to match the remote branch'; \
      docker exec $CONT_NAME git fetch --all; \
      docker exec $CONT_NAME git reset --hard origin/stage; \
      echo 'Staging - Local Repository in container was cleaned.'"
  script:
    - echo "Staging - Compiling and update the Code in Docker..."
    - mkdir -p ~/.ssh
    - echo "$FTTH_STAGE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n  StrictHostKeyChecking no\n" > ~/.ssh/config
    - |
      ssh -o StrictHostKeyChecking=no -p 9922 $STAGE_SSH_CON \
      "cd $STAGE_APPS_PATH; \
      echo 'Staging - Updating the apps from the repository...'; \
      apt update; \
      git branch --set-upstream-to=origin/stage stage; \
      git pull origin stage; \
      npm install; \
      NODE_OPTIONS="--max_old_space_size=1024" npm run build --prod; \
      docker ps --filter 'name=$CONT_NAME' --format '{{.Names}}' | grep -w $CONT_NAME > /dev/null; \
      if [ \$? -eq 0 ]; then \
        echo 'Staging - Container $CONT_NAME is already running.'; \
        docker exec $CONT_NAME apt update; \
        docker exec $CONT_NAME apt install -y curl vim git; \
        docker exec $CONT_NAME git config --global user.email 'rizal@weave.co.id'; \
        docker exec $CONT_NAME git config --global user.name 'rizal'; \
        docker exec $CONT_NAME git config --global credential.helper store; \
        docker exec $CONT_NAME git branch --set-upstream-to=origin/stage stage; \
        docker exec $CONT_NAME git pull origin stage; \
        docker exec $CONT_NAME npm install; \
        docker exec $CONT_NAME npm i sharp; \
        docker exec $CONT_NAME env NODE_OPTIONS="--max_old_space_size=1024" npm run build --prod; \
        docker stop $CONT_NAME; \
        docker start $CONT_NAME; \
        echo 'Staging - Docker Deployment Completed.'; \
        exit 0; \
      else \
        echo 'Staging - Image $REGISTRY_URL:$IMG_VER not found, start building...'; \
        docker stop $CONT_NAME; \
        docker rm $CONT_NAME; \
        docker image rm $REGISTRY_URL:$IMG_VER; \
        docker image rm $IMG_NAME:$IMG_VER; \
        docker build -t $IMG_NAME:$IMG_VER .; \
        docker tag $IMG_NAME:$IMG_VER $REGISTRY_URL:$IMG_VER; \
        docker run --name $CONT_NAME -d -p $PROD_PORT --restart=always -e $DB_HOST -it -v ~/.ssh:/root/.ssh:ro $REGISTRY_URL:$IMG_VER; \
        docker exec $CONT_NAME apt update && apt install -y curl vim git; \
        docker exec $CONT_NAME git config --global user.email 'rizal@weave.co.id'; \
        docker exec $CONT_NAME git config --global user.name 'rizal'; \
        docker exec $CONT_NAME git config --global credential.helper store; \
        docker exec $CONT_NAME git branch --set-upstream-to=origin/stage stage; \
        docker exec $CONT_NAME git pull origin stage; \
        docker exec $CONT_NAME npm install; \
        docker exec $CONT_NAME npm i sharp; \
        docker exec $CONT_NAME env NODE_OPTIONS="--max_old_space_size=1024" npm run build --prod; \
        docker stop $CONT_NAME; \
        docker start $CONT_NAME; \
        echo 'Staging - Docker Deployment Completed.'; \
      fi"
  artifacts:
    paths:
      - build/

